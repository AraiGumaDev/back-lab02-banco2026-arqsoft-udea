name: CI/CD Pipeline

on:

  workflow_dispatch:
  # Se ejecuta con cada push a la rama principal (main) y a la rama de integración (dev).
  # En dev solo corren tests, sonar y build; docker y deploy quedan restringidos a main.
  push:
    branches:
      - main
      - dev
  # Se ejecuta con cada pull request hacia main (valida los cambios antes del merge)
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Tests
        run: mvn -B test

  # Job de análisis de calidad con SonarCloud (incluye la cobertura de JaCoCo)
  sonar:
    name: SonarCloud analysis
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # fetch-depth: 0 descarga todo el historial para que Sonar calcule el "código nuevo" y los autores
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  # Job de construcción del artefacto JAR
  build:
    name: Build
    # Solo se ejecuta si el análisis de SonarCloud fue exitoso
    needs: sonar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      # Publica el JAR como artefacto del workflow para descargarlo o compartirlo con otros jobs
      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: banco2026-jar
          path: target/banco2026.jar
          if-no-files-found: error
          retention-days: 7

  # Job que construye la imagen Docker con el JAR y la publica en Docker Hub
  docker:
    name: Docker image
    # Solo se ejecuta si el build fue exitoso
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download JAR
        uses: actions/download-artifact@v5
        with:
          name: banco2026-jar
          path: target

      # Las acciones de terceros se fijan a un SHA de commit completo (inmutable) en lugar de una etiqueta
      # (@v3), que el dueño de la acción podría mover a otro código (ataque a la cadena de suministro)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Construye la imagen y la sube con dos etiquetas: latest y el SHA del commit
      - name: Build & push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/banco2026:latest
            ${{ secrets.DOCKER_USERNAME }}/banco2026:${{ github.sha }}

  # Job de despliegue en Render (nube)
  deploy:
    name: Deploy to Render
    # Solo se despliega si la imagen se publicó correctamente en Docker Hub
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RENDER_APP_URL }}
    steps:
      # El Deploy Hook le indica a Render que descargue la nueva imagen :latest y la despliegue
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      # Prueba de humo: espera a que la app responda en la nube (hasta 10 minutos)
      - name: Smoke test
        env:
          APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          sleep 60
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/v3/api-docs" || true)
            echo "Intento $i: /v3/api-docs -> HTTP $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 30
          done
          test "$code" = "200"
          # Sin credenciales la API debe responder 401 (seguridad activa)
          auth=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/api/customers")
          echo "/api/customers sin credenciales -> HTTP $auth"
          test "$auth" = "401"
