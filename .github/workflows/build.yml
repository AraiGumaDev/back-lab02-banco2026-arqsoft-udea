name: CI/CD Pipeline

on:

  workflow_dispatch:
  # Se ejecuta con cada push a la rama principal
  push:
    branches:
      - main
  # Se ejecuta con cada pull request hacia la rama principal
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Tests
        run: mvn -B test
