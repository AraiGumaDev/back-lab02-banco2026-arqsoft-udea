#app
spring.application.name=banco2026
# Render
server.port=${PORT:8080}

##DB
spring.datasource.url=${APP_DB_URL:jdbc:mysql://localhost:3306/banco2026?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${APP_DB_USER:banco_user}
spring.datasource.password=${APP_DB_PASSWORD:user123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

#Logs
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:INFO}

#Transacciones
spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true

#MVC
spring.mvc.contentnegotiation.favor-path-extension=false
spring.mvc.contentnegotiation.favor-parameter=false
spring.mvc.contentnegotiation.media-types.json=application/json

#Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
