# Configuración usada SOLO por las pruebas.
# Reemplaza a src/main/resources/application.properties para no depender de MySQL.
spring.application.name=banco2026-test

# Base de datos H2 en memoria, en modo compatible con MySQL
spring.datasource.url=jdbc:h2:mem:banco2026;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Credenciales conocidas para los usuarios en memoria
USER_PASSWORD=user-test
ADMIN_PASSWORD=admin-test

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
