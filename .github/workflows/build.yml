name: CI/CD Pipeline

on:

  workflow_dispatch:
  # Se ejecuta con cada push a la rama principal
  push:
    branches:
      - main
  # Se ejecuta con cada pull request hacia la rama principal
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Tests
        run: mvn -B test

  # Job de análisis de calidad con SonarCloud (incluye la cobertura de JaCoCo)
  sonar:
    name: SonarCloud analysis
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # fetch-depth: 0 descarga todo el historial para que Sonar calcule el "código nuevo" y los autores
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  # Job de construcción del artefacto JAR
  build:
    name: Build
    # Solo se ejecuta si el análisis de SonarCloud fue exitoso
    needs: sonar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      # Publica el JAR como artefacto del workflow para descargarlo o compartirlo con otros jobs
      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: banco2026-jar
          path: target/banco2026.jar
          if-no-files-found: error
          retention-days: 7
